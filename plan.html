<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Degree run &middot; secWeb</title>
<style>
:root{
  --bg:#0a0b10; --panel:#12141d; --panel2:#171a25; --line:#252938;
  --txt:#e8eaf2; --dim:#8b91a8; --accent:#ffd54a;
  --done:#4dd4ac; --now:#5aa9ff; --todo:#8b91a8;
}
*{box-sizing:border-box}
body{margin:0;background:
  radial-gradient(900px 500px at 12% -8%,#1c2340 0%,transparent 60%),
  radial-gradient(700px 460px at 92% 0%,#2a1836 0%,transparent 55%),var(--bg);
  color:var(--txt);font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",Inter,sans-serif;
  -webkit-font-smoothing:antialiased}
body{min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px}
a{color:var(--accent)}
.back{display:inline-block;color:var(--dim);text-decoration:none;font-weight:600;margin-bottom:18px;
  transition:transform .13s cubic-bezier(.22,1,.36,1),color .13s}
.back:hover{color:var(--accent);transform:translateX(-3px)}
h1{margin:0;font-size:clamp(26px,4vw,42px);letter-spacing:-.03em;font-weight:800;
   background:linear-gradient(92deg,#fff 10%,var(--accent) 55%,#ff8fb1 95%);
   -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:13px;margin-top:5px}
.card{background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);
  border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px;
  box-shadow:0 12px 40px -20px #000;animation:rise .34s cubic-bezier(.22,1,.36,1) both}
.card h2{margin:0 0 14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.card h2 span{text-transform:none;letter-spacing:0;color:var(--dim);font-weight:600}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---- gate ---- */
#gate{max-width:420px;margin:16vh auto 0}
#gate form{display:flex;gap:9px;margin-top:14px}
#gate input{flex:1;padding:10px 13px;border-radius:10px;border:1px solid var(--line);
  background:#0e1018;color:var(--txt);font:600 14px inherit;font-family:inherit}
#gate input:focus{outline:none;border-color:var(--accent)}
.act{display:inline-flex;align-items:center;gap:5px;padding:9px 15px;border-radius:10px;border:1px solid var(--line);
  background:#0e1018;color:var(--txt);font:700 13px/1 inherit;font-family:inherit;cursor:pointer}
.act:hover{border-color:var(--accent);color:var(--accent)}
.act.primary{background:var(--accent);color:#191100;border-color:var(--accent)}
.bad{color:#ff8f8f;font-size:12.5px;margin-top:10px;min-height:18px}
.shake{animation:shake .32s}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}

/* ---- xp bar ---- */
.xp{position:relative;height:22px;border-radius:99px;background:#0a0b10;border:1px solid var(--line);overflow:hidden}
.xp i{position:absolute;inset:0;transform-origin:left;animation:fill 1.1s cubic-bezier(.22,1,.36,1) both}
@keyframes fill{from{transform:scaleX(0)}}
.xp .earned{background:linear-gradient(90deg,#2f8f74,var(--done));z-index:2}
.xp .prog{background:repeating-linear-gradient(115deg,#24486e 0 9px,#2d5883 9px 18px);z-index:1}
.xp b{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;letter-spacing:.05em;text-shadow:0 1px 3px #000}
.xprow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:9px;flex-wrap:wrap}
.level{font-size:20px;font-weight:800;letter-spacing:-.02em}
.level small{color:var(--dim);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-left:8px}

.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:#0e1018;border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.stat .n{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.stat .l{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin-top:5px}

/* ---- quest lines ---- */
.quest{border:1px solid var(--line);background:#0e1018;border-radius:13px;padding:14px;margin-bottom:11px}
.quest.full{border-color:#22412f;background:linear-gradient(180deg,#0f1a17,#0e1018)}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer;user-select:none}
.qname{font-weight:800;font-size:14.5px;letter-spacing:-.01em}
.qcr{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;font-size:13px;color:var(--dim)}
.qcr b{color:var(--done)}
.tick{width:19px;height:19px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:900;border:2px solid var(--line);color:transparent}
.quest.full .tick{background:var(--done);border-color:var(--done);color:#08130f}
.meter{position:relative;height:8px;border-radius:99px;background:#0a0b10;border:1px solid var(--line);margin-top:10px;overflow:hidden}
.meter i{position:absolute;inset:0;transform-origin:left;animation:fill .9s cubic-bezier(.22,1,.36,1) both}
.meter .d{background:var(--done);z-index:2}
.meter .p{background:repeating-linear-gradient(115deg,#24486e 0 7px,#2d5883 7px 14px)}
.qnote{color:var(--dim);font-size:11.5px;margin-top:9px}
.tiles{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.tile{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:9px;font-size:12px;font-weight:600;
  border:1px solid var(--line);background:#0a0b10;color:var(--dim);cursor:default;
  transition:transform .13s cubic-bezier(.22,1,.36,1),filter .13s}
.tile:hover{transform:translateY(-2px);filter:brightness(1.15)}
.tile b{font-weight:800;color:var(--txt)}
.tile.done{border-color:#22412f;color:#7fe0bd}
.tile.done b{color:#7fe0bd}
.tile.ip{border-color:#22406b;color:#8cc4ff}
.tile.ip b{color:#8cc4ff}
.tile .g{font-size:11px;opacity:.8;font-variant-numeric:tabular-nums}
.tile.key::after{content:"KEY";font-size:9px;font-weight:900;letter-spacing:.08em;color:var(--accent);
  border:1px solid #4a3d12;border-radius:5px;padding:1px 4px}
.hide{display:none}

/* ---- roadmap ---- */
.road{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.term{border:1px solid var(--line);background:#0e1018;border-radius:13px;padding:13px;position:relative;overflow:hidden}
.term::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line)}
.term.done::before{background:var(--done)}
.term.ip::before{background:var(--now)}
.term.ip{border-color:#22406b;box-shadow:0 0 30px -14px var(--now)}
.thead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.thead b{font-size:13.5px;font-weight:800;letter-spacing:-.01em}
.thead span{font-size:11px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
.term ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.term li{display:flex;gap:8px;align-items:baseline;font-size:12px}
.term li b{font-weight:700;min-width:66px;white-space:nowrap;font-variant-numeric:tabular-nums}
.term li span{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.term.done li b{color:#7fe0bd}
.term.ip li b{color:#8cc4ff}
.tag{font-size:9.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:99px;
  border:1px solid var(--line);color:var(--dim)}
.term.done .tag{color:var(--done);border-color:#22412f}
.term.ip .tag{color:var(--now);border-color:#22406b}

/* ---- pickers ---- */
.pickrow{flex-wrap:wrap}
select.pick{flex:1 1 100%;margin-top:5px;padding:5px 7px;border-radius:8px;border:1px solid var(--line);
  background:#0a0b10;color:var(--dim);font:600 11.5px inherit;font-family:inherit;cursor:pointer;max-width:100%}
select.pick:hover{border-color:var(--accent)}
select.pick:focus{outline:none;border-color:var(--accent);color:var(--txt)}
.term li .off{flex:1 1 100%;font-style:normal;color:var(--dim);font-size:10.5px;margin-top:3px}
.pickrow b{color:var(--accent)}
.tile.pickd{border-style:dashed}
.tile.pickd b{color:var(--accent)}

/* ---- 4+1 branch ---- */
.branch{border-color:#3a2f4e;background:linear-gradient(180deg,#151322 0%,#171a25 100%)}
.branch h3{margin:20px 0 11px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700;
  display:flex;align-items:baseline;gap:10px}
.branch h3 .qcr{font-size:11.5px;letter-spacing:0;text-transform:none}
.branch .why{color:var(--dim);font-size:13px;line-height:1.6;max-width:70ch}
.branch .meter{margin-bottom:9px}
.gates{display:flex;flex-direction:column;gap:7px}
.gate{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:#0a0b10;
  border-radius:11px;padding:10px 12px}
.gate.met{border-color:#22412f;background:linear-gradient(180deg,#0f1a17,#0a0b10)}
.gate .tick{margin-top:1px;color:transparent}
.gate.met .tick{background:var(--done);border-color:var(--done);color:#08130f}
.gate b{display:block;font-size:13px;font-weight:700}
.gate.met b{color:#7fe0bd}
.gate span{display:block;color:var(--dim);font-size:11.5px;margin-top:3px;line-height:1.5}
.swaps{width:100%;border-collapse:collapse;font-size:12.5px}
.swaps th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  font-weight:700;padding:0 10px 7px;border-bottom:1px solid var(--line)}
.swaps td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.swaps tr:last-child td{border-bottom:0}
.swaps td.dim{color:var(--dim)}
.swaps td b{color:var(--accent);font-weight:700}
.swaps td span{display:block;color:var(--dim);font-size:11.5px;margin-top:3px}
.msreq{border:1px solid var(--line);background:#0a0b10;border-radius:11px;padding:12px;margin-bottom:8px}
.msreq .meter{margin-bottom:0}

/* ---- badges ---- */
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.badge{border:1px solid var(--line);background:#0a0b10;border-radius:12px;padding:12px;opacity:.42;
  transition:transform .15s cubic-bezier(.22,1,.36,1)}
.badge:hover{transform:translateY(-2px)}
.badge.got{opacity:1;border-color:#4a3d12;background:linear-gradient(180deg,#171307,#0e1018)}
.badge b{display:block;font-size:13px;font-weight:800;letter-spacing:-.01em}
.badge.got b{color:var(--accent)}
.badge span{display:block;color:var(--dim);font-size:11.5px;margin-top:4px}

.warn{display:flex;gap:10px;font-size:12.5px;color:#ffd0a0;background:#150f07;border:1px solid #45351a;
  border-radius:11px;padding:11px 13px;margin-bottom:9px;line-height:1.55}
.warn::before{content:"!";font-weight:900;color:var(--accent);flex:none;width:17px;height:17px;border-radius:50%;
  border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;margin-top:1px}
.rules{margin:0;padding-left:18px;color:var(--dim);font-size:12.5px;line-height:1.75}
.note{color:var(--dim);font-size:11.5px;margin-top:12px;line-height:1.6}
footer{color:var(--dim);font-size:11.5px;text-align:center;margin-top:26px}
@media (prefers-reduced-motion:reduce){
  .card,.badge,.tile,.back{animation:none;transition:none}
  .xp i,.meter i{animation:none}
}
</style>
</head>
<body>
<div class="wrap">

<div class="card" id="gate">
  <h2>Locked</h2>
  <div style="font-size:13px;color:var(--dim)">Degree planning. Encrypted on this page &mdash; the password is the key, not a check.</div>
  <form id="gform" autocomplete="off">
    <input id="pw" type="password" placeholder="password" autofocus>
    <button class="act primary" type="submit">Open</button>
  </form>
  <div class="bad" id="bad"></div>
</div>

<div id="app" hidden></div>
</div>

async function unlock(pw){
  const [s,iv,ct]=ENC.split(".").map(b64);
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:s,iterations:2e5,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);   // throws on a wrong password
  return JSON.parse(new TextDecoder().decode(plain));
}

$("#gform").onsubmit=async e=>{
  e.preventDefault();
  $("#bad").textContent="";
  try{
    const d=await unlock($("#pw").value);
    sessionStorage.setItem("plan-pw",$("#pw").value);
    $("#gate").remove(); render(d);
  }catch{
    $("#bad").textContent="Wrong password.";
    $("#gate").classList.remove("shake"); void $("#gate").offsetWidth; $("#gate").classList.add("shake");
    $("#pw").select();
  }
};

// re-open without retyping within the tab
addEventListener("DOMContentLoaded",async()=>{
  const pw=sessionStorage.getItem("plan-pw"); if(!pw) return;
  try{ const d=await unlock(pw); $("#gate").remove(); render(d) }catch{ sessionStorage.removeItem("plan-pw") }
});

let PICKS={}; try{ PICKS=JSON.parse(localStorage.getItem(PK)||"{}") }catch{}
const savePicks=()=>{ try{ localStorage.setItem(PK,JSON.stringify(PICKS)) }catch{} };
const cr=c=>(PICKS[c.c]&&PICKS[c.c].cr!=null)?PICKS[c.c].cr:c.cr;   // a pick may carry its own credits

function options(kind,sel){
  const o=(v,label,on)=>`<option value="${esc(v)}"${on?" selected":""}>${esc(label)}</option>`;
  const flat=list=>list.map(c=>o(c.c,`${c.c} — ${c.t}${c.cr?` (${c.cr} cr)`:""}`,sel===c.c)).join("");
  if(kind==="sci") return flat(OPTS.sci);
  if(kind==="brd") return flat(OPTS.brd);
  if(kind==="ece") return flat(OPTS.ece);
  const up=kind==="genU";                       // the upper-level slots only accept advanced courses
  return (OPTS.genEd||[]).map(g=>{
    const cs=g.c.filter(c=>!up||c.u);
    return cs.length?`<optgroup label="${esc(g.d)} (${esc(g.s)})">`+
      cs.map(c=>{const code=`${g.s} ${c.n}`; return o(code,code+(c.u?" · upper":""),sel===code)}).join("")+"</optgroup>":"";
  }).join("");
}

function picked(code){
  const p=PICKS[code]; if(!p) return null;
  const all=[...(OPTS.sci||[]),...(OPTS.brd||[]),...(OPTS.ece||[])].find(x=>x.c===p.c);
  return {c:p.c,t:all?all.t:"",off:all?all.off:""};
}

async function render(D){
  await loadOpts;
  const now=D.terms.indexOf(D.asOf);
  const ti=c=>D.terms.indexOf(c.term);
  const st=c=>ti(c)<now?"done":ti(c)===now?"ip":"todo";     // past / this semester / ahead
  const sum=(f,s)=>D.courses.filter(c=>f(c)&&(s?st(c)===s:1)).reduce((a,c)=>a+cr(c),0);

  const earned=sum(()=>1,"done"), prog=sum(()=>1,"ip"), left=D.totalCredits-earned-prog;
  const lvl=LEVELS.filter(l=>earned+prog>=l[0]).pop();
  const nxt=LEVELS.find(l=>l[0]>earned+prog);
  const terms=D.terms.filter(t=>t!=="AP");
  const ahead=terms.length-terms.indexOf(D.asOf)-1;

  const P=D.plus1;
  const app=$("#app"); app.hidden=false;
  app.innerHTML=`
<a class="back" href="index.html">&larr; back to the grid</a>
<div style="margin-bottom:22px">
  <h1>Degree run</h1>
  <div class="sub">${esc(D.student)} &middot; ${esc(D.program)} &middot; ${esc(D.catalog)}</div>
</div>

<div class="card">
  <div class="xprow">
    <div class="level">${esc(lvl[1])}<small>level ${LEVELS.indexOf(lvl)+1} of ${LEVELS.length}</small></div>
    <div style="color:var(--dim);font-size:12px">${nxt?`${nxt[0]-earned-prog} credits to ${esc(nxt[1])}`:"degree complete"}</div>
  </div>
  <div class="xp">
    <i class="prog" style="transform:scaleX(${(earned+prog)/D.totalCredits})"></i>
    <i class="earned" style="transform:scaleX(${earned/D.totalCredits})"></i>
    <b>${earned} earned &middot; ${prog} in progress &middot; ${D.totalCredits} to graduate</b>
  </div>
</div>

<div class="card"><h2>Run stats</h2><div class="statgrid">
  ${[[earned,"credits earned"],[prog,"in progress"],[left,"still to take"],
     [D.gpa.toFixed(2),"cumulative GPA"],[ahead,"semesters left"],[terms[terms.length-1],"projected finish"]]
    .map(([n,l])=>`<div class="stat"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div></div>`).join("")}
</div></div>

<div class="card"><h2>Requirement quests <span>&mdash; click one to see the courses in it</span></h2>
  ${D.buckets.map(b=>{
    const mine=D.courses.filter(c=>c.b===b.id);
    const d=sum(c=>c.b===b.id,"done"), p=sum(c=>c.b===b.id,"ip");
    const need=b.need||d+p+sum(c=>c.b===b.id,"todo");
    return `<div class="quest${d>=need&&need?" full":""}" data-q="${esc(b.id)}">
      <div class="qhead"><span class="tick">&#10003;</span><span class="qname">${esc(b.name)}</span>
        <span class="qcr"><b>${d}</b>${p?` +${p}`:""} / ${need}</span></div>
      <div class="meter"><i class="p" style="transform:scaleX(${Math.min(1,(d+p)/need)})"></i><i class="d" style="transform:scaleX(${Math.min(1,d/need)})"></i></div>
      <div class="qnote">${esc(b.note)}</div>
      <div class="tiles hide">${mine.map(c=>{
        const s=st(c);
        const p=picked(c.c);
        return `<span class="tile ${s}${c.key?" key":""}${c.pick?" pickd":""}" title="${esc(p?p.t||p.c:c.t)}${c.pre?" · needs "+esc(c.pre):""}">
          <b>${esc(p?p.c:c.c)}</b><span>${cr(c)}cr</span>${c.g?`<span class="g">${esc(c.g)}</span>`:""}</span>`;
      }).join("")||'<span class="qnote">Nothing slotted yet.</span>'}</div>
    </div>`;
  }).join("")}
</div>

<div class="card"><h2>Roadmap <span>&mdash; ${D.courses.filter(c=>c.pick&&PICKS[c.c]).length} of ${D.courses.filter(c=>c.pick).length} open slots filled</span></h2>
  <div class="road">
  ${D.terms.map((t,i)=>{
    const cs=D.courses.filter(c=>c.term===t);
    const s=i<now?"done":i===now?"ip":"";
    return `<div class="term ${s}">
      <div class="thead"><b>${esc(t)}</b><span>${cs.reduce((a,c)=>a+cr(c),0)} cr</span></div>
      <ul>${cs.map(c=>{
        if(!c.pick) return `<li><b>${esc(c.c)}</b><span title="${esc(c.t)}">${esc(c.t)}</span></li>`;
        const p=picked(c.c), sel=PICKS[c.c]?PICKS[c.c].c:"";
        return `<li class="pickrow"><b>${p?esc(p.c):esc(c.c)}</b>
          <select class="pick" data-slot="${esc(c.c)}" data-kind="${esc(c.pick)}">
            <option value=""${sel?"":" selected"}>${esc(c.t)} &mdash; choose&hellip;</option>
            ${options(c.pick,sel)}
          </select>${p&&p.off?`<i class="off">${esc(p.off)}</i>`:""}</li>`;
      }).join("")}</ul>
      <div style="margin-top:10px"><span class="tag">${i<now?"cleared":i===now?"in progress":"planned"}</span>
        ${cs.some(c=>c.pick)?`<span class="tag">${cs.filter(c=>c.pick&&PICKS[c.c]).length}/${cs.filter(c=>c.pick).length} chosen</span>`:""}</div>
    </div>`;
  }).join("")}
</div>
  <div class="note">Dropdowns list Purdue&rsquo;s approved courses for each slot. Choices are saved in this browser only &mdash;
    they never leave the page. <button class="act" id="resetpicks">Clear choices</button></div>
</div>

${P?`
<div class="card branch"><h2>${esc(P.name)} branch <span>&mdash; optional fifth year, finishes ${esc(P.finish)}</span></h2>
  <div class="why">${esc(P.why)}</div>

  <h3>Unlock conditions</h3>
  <div class="gates">${P.gates.map(g=>
    `<div class="gate${g.met?" met":""}"><span class="tick">&#10003;</span>
      <div><b>${esc(g.t)}</b><span>${esc(g.d)}</span></div></div>`).join("")}</div>

  <h3>Dual-counted credits <span class="qcr"><b>${P.swaps.filter(s=>s.in!=="—").length*3}</b> / ${P.dualNeed} planned</span></h3>
  <div class="meter"><i class="d" style="transform:scaleX(${Math.min(1,P.swaps.filter(s=>s.in!=="—").length*3/P.dualNeed)})"></i></div>
  <table class="swaps"><tr><th>Term</th><th>Drop</th><th>Take instead</th></tr>
    ${P.swaps.map(s=>`<tr><td class="dim">${esc(s.term)}</td><td class="dim">${esc(s.out)}</td>
      <td><b>${esc(s.in)}</b><span>${esc(s.note)}</span></td></tr>`).join("")}
  </table>

  <h3>Graduate year</h3>
  <div class="road">${P.grad.map(t=>`<div class="term">
    <div class="thead"><b>${esc(t.term)}</b><span>${t.cr} cr</span></div>
    <ul>${t.courses.map(c=>`<li><b>${esc(c.c)}</b><span title="${esc(c.t)}">${esc(c.t)}</span></li>`).join("")}</ul>
    <div style="margin-top:10px"><span class="tag">optional</span></div></div>`).join("")}</div>

  <h3>MSECE requirements <span class="qcr">coursework-only track</span></h3>
  ${P.ms.map(m=>`<div class="msreq">
    <div class="qhead"><span class="qname">${esc(m.n)}</span><span class="qcr"><b>${m.have}</b> / ${m.need}</span></div>
    <div class="meter"><i class="d" style="transform:scaleX(${Math.min(1,m.have/m.need)})"></i></div>
    <div class="qnote">${esc(m.d)}</div></div>`).join("")}

  ${P.notes.map(n=>`<div class="warn">${esc(n)}</div>`).join("")}
</div>`:""}

<div class="card"><h2>Achievements <span>&mdash; ${D.badges.filter(b=>b.got).length} of ${D.badges.length}</span></h2>
  <div class="badges">${D.badges.map(b=>
    `<div class="badge${b.got?" got":""}"><b>${b.got?"":"&#128274; "}${esc(b.n)}</b><span>${esc(b.d)}</span></div>`).join("")}</div>
</div>

<div class="card"><h2>Watch out</h2>
  ${D.warnings.map(w=>`<div class="warn">${esc(w)}</div>`).join("")}
  <ul class="rules">${D.rules.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>
  <div class="note">Requirements read from Purdue&rsquo;s ECE undergraduate curriculum pages and the Elmore School CmpE plan of study;
    completed work from your academic transcript. Selectives past the required 16 credits are a guess at a computer-systems slant &mdash;
    swap them freely, the credit totals are what matter. Confirm anything load-bearing with your ECE advisor.</div>
</div>
<footer>Encrypted on this device &middot; nothing leaves the page</footer>`;

  document.querySelectorAll(".qhead").forEach(h=>
    h.onclick=()=>h.parentElement.querySelector(".tiles").classList.toggle("hide"));

  document.querySelectorAll("select.pick").forEach(s=>s.onchange=()=>{
    const slot=s.dataset.slot, code=s.value;
    if(!code) delete PICKS[slot];
    else{
      const known=[...(OPTS.sci||[]),...(OPTS.brd||[]),...(OPTS.ece||[])].find(x=>x.c===code);
      PICKS[slot]={c:code,cr:known?known.cr:null};   // gen ed has no published credit count; keep the slot's
    }
    savePicks(); render(D);
  });
  const rb=$("#resetpicks");
  if(rb) rb.onclick=()=>{ PICKS={}; savePicks(); render(D) };
}
</script>
</body>
</html>
