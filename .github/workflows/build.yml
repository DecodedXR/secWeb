name: build
# Regenerate schedule.json + difficulty.json when a schedule or script changes; Pages redeploys off main.
on:
  push:
    branches: [main]
    paths: ["*.csv", "build.py", "difficulty.py", "syllabus.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python build.py && python difficulty.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add schedule.json difficulty.json syllabi.json
          git diff --cached --quiet || { git commit -m "Rebuild schedule and difficulty"; git pull --rebase && git push; }
